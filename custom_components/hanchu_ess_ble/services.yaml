confirm_write:
  name: Confirm write
  description: Write all staged changes to the inverter in one BLE transaction. Unlike pressing the button, it can return a success flag and message to the calling script via response_variable.
read_registers:
  name: Read registers
  description: Read-only diagnostic. Reads the given register keys once from the inverter, or from a battery if battery_address is set, and returns the raw values. Does not create entities or write anything.
  fields:
    keys:
      name: Register keys
      description: Register keys to read, e.g. L108, L114, P511 (inverter) or B183 (battery).
      required: true
      example: '["L108", "L114", "P511"]'
      selector:
        object:
    battery_address:
      name: Battery address
      description: Bluetooth address of a configured battery. Leave empty to read from the inverter.
      required: false
      example: "84:1F:E8:44:00:9E"
      selector:
        text:
sync_clock:
  name: Sync clock (experimental)
  description: Checks the inverter clock (L094) and daylight-saving offset (L096, in minutes) against Home Assistant and writes only what is wrong, then reads both back to confirm. Untested on most systems; try dry_run first.
  fields:
    dry_run:
      name: Dry run
      description: Read and report what would be written, without writing anything.
      required: false
      default: true
      selector:
        boolean:
    force:
      name: Force
      description: Write both registers even if they already look correct.
      required: false
      default: false
      selector:
        boolean:
