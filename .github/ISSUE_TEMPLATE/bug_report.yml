name: Bug report
description: Report a problem with the Hanchu ESS BLE integration
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Most BLE problems depend on
        the Bluetooth setup, so the more of this you can fill in, the quicker
        it can be tracked down.

        The most useful attachment is a **Download diagnostics** export
        (Settings → Devices & services → Hanchu ESS BLE → ⋮ → Download
        diagnostics). It removes Bluetooth addresses and serial numbers.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: If it's intermittent (dropouts, stalls), say roughly how often and for how long.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.2"
    validations:
      required: true
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: From HACS or custom_components/hanchu_ess_ble/manifest.json
      placeholder: "1.8.1"
    validations:
      required: true
  - type: input
    id: inverter
    attributes:
      label: Inverter model and logger
      description: >
        Model (e.g. HESS-HY-S-5.0K) and the first part of the logger name
        (e.g. HC:L110). No need for the full serial.
    validations:
      required: true
  - type: dropdown
    id: bluetooth_source
    attributes:
      label: Bluetooth source
      options:
        - ESPHome Bluetooth proxy
        - Built-in / USB Bluetooth adapter on the HA host
        - Other
    validations:
      required: true
  - type: input
    id: bluetooth_details
    attributes:
      label: Bluetooth details
      description: >
        Proxy hardware and ESPHome version (e.g. M5Stack Atom Lite, ESPHome
        2026.7.4), or adapter model. Include the RSSI to the inverter if you
        know it.
      placeholder: "M5Stack Atom Lite, ESPHome 2026.7.4, RSSI -55"
  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - HACS
        - Manual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: >
        Enable debug logging for `custom_components.hanchu_ess_ble` to
        capture more (see CONTRIBUTING.md). Debug logs contain Bluetooth
        addresses; remove them before posting if you prefer.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Diagnostics export, screenshots, anything else.
