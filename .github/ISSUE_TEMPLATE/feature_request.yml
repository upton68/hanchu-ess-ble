name: Feature request
description: Suggest an idea or improvement, including new registers
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or awkward today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: registers
    attributes:
      label: Registers involved (if any)
      description: >
        Register keys (e.g. P511, B183), what they mean, the values you've
        seen, and how you found them (vendor app menu, read_registers
        service, another project). Say whether you've read or written them
        on your own system, and on which inverter or battery model.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Device model, screenshots, links, etc.
